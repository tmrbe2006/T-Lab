<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (currentFetch) {
            var desc = {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              },
            };
            Object.defineProperty(window, 'fetch', desc);
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            }
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (ev) {
            var msg = (ev && ev.message ? String(ev.message) : '') + (ev && ev.error && ev.error.message ? String(ev.error.message) : '');
            var file = ev && ev.filename ? String(ev.filename) : '';
            if (
              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('@vite/client') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1
            ) {
              ev.stopImmediatePropagation();
              ev.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (ev) {
            var reason = ev && ev.reason;
            var msg = reason ? String(reason.message || reason) : '';
            var stack = reason && reason.stack ? String(reason.stack) : '';
            if (
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              stack.indexOf('@vite/client') !== -1
            ) {
              ev.stopImmediatePropagation();
              ev.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>Medical Lab Management System | نظام إدارة معمل التحاليل الطبية</title>
    <meta name="description" content="نظام إدارة معمل تحاليل طبية متكامل ثنائي اللغة (عربي/إنجليزي) يعمل كتطبيق ويب تقدمي (PWA) مع قاعدة بيانات محلية IndexedDB ونظام محاسبي وصلاحيات متقدم." />
