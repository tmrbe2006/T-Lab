name: Security Phase Checks
on:
  push:
    branches:
      - security/phase-1-rbac-hardening-20261119
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Security regression tests
        run: npx vitest run server/api-security.test.ts src/guards/permission.guard.test.ts
      - name: Full existing unit regression suite
        run: npx vitest run
      - name: Backup crypto and installer safety tests
        run: node --test scripts/backup-crypto.test.mjs scripts/installer-safety.test.mjs
      - name: Production build
        run: npm run build
      - name: Production server static-mode smoke test
        run: node scripts/production-smoke.mjs
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (login and 40 screens)
        run: npx playwright test
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlab-browser-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  mysql55:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:5.5
        env:
          MYSQL_ROOT_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --password=ci-only-mysql-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: MySQL 5.5 schema and transactional integrity
        env:
          TLAB_RUN_MYSQL55_TESTS: 'true'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
        run: npx vitest run server/mysql55.integration.test.ts
      - name: Verify empty-schema Windows pilot sandbox initialization
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_ci_fresh_test
          TLAB_ADMIN_PASSWORD: ci-only-sandbox-developer-strong-2026
          TLAB_SANDBOX_INIT: CONFIRM_EMPTY_TEST_DATABASE
          TLAB_ENABLE_LEGACY_API: 'false'
          MYSQL_AUTO_SYNC: 'false'
        run: |
          node --input-type=module -e "import mysql from 'mysql2/promise'; const db=await mysql.createConnection({host:'127.0.0.1',user:'root',password:'ci-only-mysql-password'});await db.query('CREATE DATABASE tlab_ci_fresh_test CHARACTER SET utf8 COLLATE utf8_general_ci');await db.end()"
          node --import tsx scripts/init-sandbox.ts
          node --import tsx scripts/check-local-sandbox.ts
          if node --import tsx scripts/init-sandbox.ts; then
            echo 'ERROR: second sandbox initialization unexpectedly succeeded'
            exit 1
          fi
          MYSQL_DATABASE=tlab_mysql55_ci node --import tsx scripts/check-local-sandbox.ts && exit 1 || true
      - name: Encrypted backup of synthetic MySQL 5.5 CI database
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
          TLAB_BACKUP_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          TLAB_BACKUP_DIR: /tmp/tlab-test-backups
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          chmod +x scripts/ci-mysql55-dump.sh
          export TLAB_MYSQLDUMP_BIN="$PWD/scripts/ci-mysql55-dump.sh"
          node scripts/backup-mysql.mjs
          archive=$(find /tmp/tlab-test-backups -name '*.sql.gz.enc' -print -quit)
          test -n "$archive"
          node scripts/verify-backup.mjs "$archive"
          TLAB_ALLOW_TEST_RESTORE=true TLAB_RESTORE_TEST_DATABASE=tlab_ci_restore_check node scripts/restore-check.mjs "$archive"
      - name: Install Chromium for MySQL integration
        run: npx playwright install --with-deps chromium
      - name: Browser staff pilot against MySQL 5.5
        env:
          TLAB_STAFF_E2E: 'true'
          TLAB_ADMIN_PASSWORD: ci-test-only-not-for-production-507218
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
        run: npx playwright test tests/e2e/staff-pilot.e2e.ts
      - name: Upload staff browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlab-mysql55-staff-browser
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output
      - name: Validate sandbox PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\\scripts\\windows-local-pilot.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
      - name: Validate Windows setup script by compiling it
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 compiler missing' }
          & $iscc '.\tlab-setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      # Safety: do NOT publish the installer until clinical and finance acceptance.
