name: Security Phase Checks
on:
  push:
    branches:
      - security/phase-1-rbac-hardening-20261119
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Security regression tests
        run: npx vitest run server/api-security.test.ts src/guards/permission.guard.test.ts
      - name: Full existing unit regression suite
        run: npx vitest run
      - name: Backup crypto and installer safety tests
        run: node --test scripts/backup-crypto.test.mjs scripts/installer-safety.test.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (login and 40 screens)
        run: npx playwright test
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlab-browser-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  mysql55:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:5.5
        env:
          MYSQL_ROOT_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --password=ci-only-mysql-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: MySQL 5.5 schema and transactional integrity
        env:
          TLAB_RUN_MYSQL55_TESTS: 'true'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
        run: npx vitest run server/mysql55.integration.test.ts
      - name: Encrypted backup of synthetic MySQL 5.5 CI database
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
          TLAB_BACKUP_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          TLAB_BACKUP_DIR: /tmp/tlab-test-backups
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          node scripts/backup-mysql.mjs
          archive=$(find /tmp/tlab-test-backups -name '*.sql.gz.enc' -print -quit)
          test -n "$archive"
          node scripts/verify-backup.mjs "$archive"
      - name: Install Chromium for MySQL integration
        run: npx playwright install --with-deps chromium
      - name: Browser staff pilot against MySQL 5.5
        env:
          TLAB_STAFF_E2E: 'true'
          TLAB_ADMIN_PASSWORD: ci-test-only-not-for-production-507218
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-mysql-password
          MYSQL_DATABASE: tlab_mysql55_ci
        run: npx playwright test tests/e2e/staff-pilot.e2e.ts
      - name: Upload staff browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlab-mysql55-staff-browser
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
