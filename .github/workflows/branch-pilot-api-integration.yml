name: Branch pilot authenticated API integration
on:
  push:
    paths:
      - 'server/branch-pilot-api.ts'
      - 'server/mysql-crud-routes.ts'
      - 'server/mysql-unified-store.ts'
      - 'src/services/mysql-sync.service.ts'
      - 'src/db/global-medical-tests.ts'
      - 'src/pages/purchases/purchases.page.ts'
      - 'scripts/import-browser-backup-mysql.mts'
      - 'scripts/ui-screens-smoke.mjs'
      - 'src/db/mysql-remote-db.ts'
      - 'src/db/database.ts'
      - 'src/tests/services/mysql-remote-db.test.ts'
      - 'sql/tlab_main_mysql_repair_v10.sql'
      - 'sql/TLab_Unified_MySQL_49_Tables_v11.sql'
      - 'sql/tlab_all_49_store_branch_access_v8.sql'
      - 'src/repositories/mysql-crud.adapter.ts'
      - 'server/branch-service.ts'
      - 'server/branch-access.ts'
      - 'server/branch-user-permissions.ts'
      - 'sql/tlab_branch_user_permissions_v2.sql'
      - 'server.ts'
      - 'sql/tlab_multibranch_additive_v1.sql'
      - '.github/workflows/branch-pilot-api-integration.yml'
  workflow_dispatch:
jobs:
  branch-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: tlab_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Set up disposable representative legacy database and additive branch migration
        run: |
          mysql -h 127.0.0.1 -uroot -pintegration-only-password tlab_db <<'SQL'
          CREATE TABLE users (id VARCHAR(64) PRIMARY KEY, username VARCHAR(64), role VARCHAR(64), active TINYINT(1), raw_json LONGTEXT) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_general_ci;
          INSERT INTO users VALUES ('usr_owner', 'owner', 'Owner', 1, '{"passwordHash":"test-only-admin-password"}');
          INSERT INTO users VALUES ('usr_dev', 'developer', 'Developer', 1, '{"passwordHash":"dev-test-password"}');
          INSERT INTO users VALUES ('usr_staff', 'staff', 'Receptionist', 1, '{"passwordHash":"staff-password"}');
          CREATE TABLE patients (id VARCHAR(64) PRIMARY KEY);
          CREATE TABLE lab_tests (id VARCHAR(64) PRIMARY KEY);
          CREATE TABLE test_parameters (id VARCHAR(64) PRIMARY KEY);
          CREATE TABLE lab_requests (id VARCHAR(64) PRIMARY KEY);
          CREATE TABLE invoices (id VARCHAR(64) PRIMARY KEY);
          SQL
          mysql -h 127.0.0.1 -uroot -pintegration-only-password < sql/tlab_multibranch_additive_v1.sql
          sed 's/USE `tlab_multibranch_pilot`;/USE `tlab_db`;/' sql/tlab_branch_user_permissions_v2.sql | mysql -h 127.0.0.1 -uroot -pintegration-only-password
          sed 's/USE `tlab_multibranch_pilot`;/USE `tlab_db`;/' sql/tlab_mysql_only_all_49_tables_create_safe.sql | mysql -h 127.0.0.1 -uroot -pintegration-only-password
          sed 's/USE `tlab_multibranch_pilot`;/USE `tlab_db`;/' sql/tlab_all_49_store_branch_access_v8.sql | mysql -h 127.0.0.1 -uroot -pintegration-only-password
          mysql -h 127.0.0.1 -uroot -pintegration-only-password tlab_db < sql/tlab_main_mysql_repair_v10.sql
          mysql -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "ALTER TABLE users ADD COLUMN full_name_ar VARCHAR(191) NULL;"
      - name: Validate complete 49-table unified SQL on clean MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -pintegration-only-password -e "CREATE DATABASE tlab_schema_verification CHARACTER SET utf8 COLLATE utf8_general_ci"
          sed 's/USE `tlab_multibranch_pilot`;/USE `tlab_schema_verification`;/' sql/TLab_Unified_MySQL_49_Tables_v11.sql | mysql -h 127.0.0.1 -uroot -pintegration-only-password
          n=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_schema_verification -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE()")
          test "$n" -ge 59
          mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_schema_verification -e "SHOW TABLES LIKE 'mysql_store_branch_access'" | grep mysql_store_branch_access
      - name: Start local-only branch administration and verify actual HTTP/MySQL operations
        env:
          PORT: '3127'
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: integration-only-password
          MYSQL_DATABASE: tlab_db
          TLAB_BRANCH_PILOT_ADMIN_ENABLED: 'true'
        run: |
          set -euo pipefail
          node --import tsx server.ts --static-dist --port 3127 > branch-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat branch-server.log' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3127/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:3127/api/branch-pilot/connection-status | grep '"ok":true'
          curl -fsS http://127.0.0.1:3127/api/branch-pilot/connection-status | grep '"database":"tlab_db"'
          curl -fsS http://127.0.0.1:3127/api/branch-pilot/connection-status | grep '"existingTablesCount"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3127/api/mysql/env-config)
          test "$code" = 403
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3127/api/branch-pilot/branches)
          test "$code" = 401
          root_result=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"username":"root","password":"database-password"}' http://127.0.0.1:3127/api/branch-pilot/login)
          echo "$root_result" | grep 'MYSQL_USER_IS_NOT_APP_USER'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"staff","password":"staff-password"}' http://127.0.0.1:3127/api/branch-pilot/login)
          test "$code" = 401
          code=$(curl -s -c cookies.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"owner","password":"test-only-admin-password"}' http://127.0.0.1:3127/api/branch-pilot/login)
          test "$code" = 200
          curl -fsS -b cookies.txt http://127.0.0.1:3127/api/branch-pilot/schema-status | grep '"ready":true'
          curl -fsS -b cookies.txt http://127.0.0.1:3127/api/branch-pilot/schema-status | grep '"missingTables":\[\]'
          curl -fsS -b cookies.txt http://127.0.0.1:3127/api/branch-pilot/branches | grep branch_main
          # Owner may assign users and manage permissions, but never create branches.
          code=$(curl -s -b cookies.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"nameAr":"الفرع الثاني","nameEn":"Branch Two"}' http://127.0.0.1:3127/api/branch-pilot/branches)
          test "$code" = 403
          code=$(curl -s -c developer-cookies.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"developer","password":"dev-test-password"}' http://127.0.0.1:3127/api/branch-pilot/login)
          test "$code" = 200
          branch_response=$(curl -fsS -b developer-cookies.txt -X POST -H 'Content-Type: application/json' -d '{"nameAr":"الفرع الثاني","nameEn":"Branch Two"}' http://127.0.0.1:3127/api/branch-pilot/branches)
          echo "$branch_response" | grep '"code":"BR-002"'
          next_response=$(curl -fsS -b developer-cookies.txt -X POST -H 'Content-Type: application/json' -d '{"nameAr":"الفرع الثالث","nameEn":"Branch Three"}' http://127.0.0.1:3127/api/branch-pilot/branches)
          echo "$next_response" | grep '"code":"BR-003"'
          new_id=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT id FROM branches WHERE code='BR-002'")
          test -n "$new_id"
          code=$(curl -s -b cookies.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"userId\":\"usr_staff\",\"branchId\":\"$new_id\"}" http://127.0.0.1:3127/api/branch-pilot/assign)
          test "$code" = 200
          assigned=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT COUNT(*) FROM user_branches WHERE user_id='usr_staff' AND branch_id='$new_id'")
          test "$assigned" = 1
          third_id=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT id FROM branches WHERE code='BR-003'")
          test -n "$third_id"
          code=$(curl -s -b cookies.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"userId\":\"usr_staff\",\"branchId\":\"$third_id\"}" http://127.0.0.1:3127/api/branch-pilot/assign)
          test "$code" = 200

          # An assigned employee sees only their branch and cannot access an unassigned branch.
          # Owner sets full 38-screen matrix for this user on BR-002 only.
          BRANCH_ID="$new_id" node --import tsx --input-type=module -e "
          import { BRANCH_ACTIONS, BRANCH_RESOURCES } from './server/branch-user-permissions.ts';
          const rows=BRANCH_RESOURCES.map(resource => ({
            resource,actions:Object.fromEntries(BRANCH_ACTIONS.map(action => [action,resource==='patients' && action==='view']))
          }));
          process.stdout.write(JSON.stringify({userId:'usr_staff',branchId:process.env.BRANCH_ID,rows}));
          " > branch-permission-payload.json
          curl -fsS -b cookies.txt -X POST -H 'Content-Type: application/json' --data-binary @branch-permission-payload.json http://127.0.0.1:3127/api/branch-pilot/user-permissions | grep '"ok":true'
          curl -fsS -b cookies.txt "http://127.0.0.1:3127/api/branch-pilot/user-permissions?userId=usr_staff&branchId=$new_id" | grep '"resource":"patients"'
          assigned_rows=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT COUNT(*) FROM user_branch_permissions WHERE user_id='usr_staff' AND branch_id='$new_id'")
          test "$assigned_rows" = 38
          # A different matrix on BR-003 for the SAME employee.
          BRANCH_ID="$third_id" node --import tsx --input-type=module -e "
          import { BRANCH_ACTIONS, BRANCH_RESOURCES } from './server/branch-user-permissions.ts';
          const rows=BRANCH_RESOURCES.map(resource => ({
            resource,actions:Object.fromEntries(BRANCH_ACTIONS.map(action => [action,resource==='requests' && action==='view']))
          }));
          process.stdout.write(JSON.stringify({userId:'usr_staff',branchId:process.env.BRANCH_ID,rows}));
          " > third-permission-payload.json
          curl -fsS -b cookies.txt -X POST -H 'Content-Type: application/json' --data-binary @third-permission-payload.json http://127.0.0.1:3127/api/branch-pilot/user-permissions | grep '"ok":true'
          matrix_2=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT actions_json FROM user_branch_permissions WHERE user_id='usr_staff' AND branch_id='$new_id' AND resource='patients'")
          matrix_3=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT actions_json FROM user_branch_permissions WHERE user_id='usr_staff' AND branch_id='$third_id' AND resource='patients'")
          echo "$matrix_2" | grep '"view":true'
          echo "$matrix_3" | grep '"view":false'

          # The same employee cannot have access to the unassigned BR-003.
          staff_branches=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"username":"staff","password":"staff-password"}' http://127.0.0.1:3127/api/branch-pilot/staff-branches)
          echo "$staff_branches" | grep "BR-002"
          echo "$staff_branches" | grep "BR-003"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"staff","password":"staff-password","branchId":"unknown_branch"}' http://127.0.0.1:3127/api/branch-pilot/staff-login)
          test "$code" = 403
          code=$(curl -s -c staff-cookies.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"username\":\"staff\",\"password\":\"staff-password\",\"branchId\":\"$new_id\"}" http://127.0.0.1:3127/api/branch-pilot/staff-login)
          test "$code" = 200
          curl -fsS -b staff-cookies.txt http://127.0.0.1:3127/api/branch-pilot/staff-session | grep "$new_id"
          curl -fsS -b staff-cookies.txt http://127.0.0.1:3127/api/branch-pilot/staff-session | grep '"resource":"patients"'
          # Switching to the second assigned branch must load its distinct matrix.
          curl -fsS -c staff-three.txt -X POST -H 'Content-Type: application/json' -d "{\"username\":\"staff\",\"password\":\"staff-password\",\"branchId\":\"$third_id\"}" http://127.0.0.1:3127/api/branch-pilot/staff-login | grep "$third_id"
          curl -fsS -b staff-three.txt http://127.0.0.1:3127/api/branch-pilot/staff-session | grep '"resource":"requests"'
          code=$(curl -s -b staff-cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:3127/api/branch-pilot/users)
          test "$code" = 403

          # New MySQL CRUD: Developer staff session, contract insert and archive.
          code=$(curl -s -c developer-main.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"developer","password":"dev-test-password","branchId":"branch_main"}' http://127.0.0.1:3127/api/branch-pilot/staff-login)
          test "$code" = 200
          contract='{"record":{"id":"ct_ci_1","code":"CI-INS","nameAr":"Test Insurance","nameEn":"Test Insurance","category":"insurance","discountPercent":5,"patientCoPayPercent":20,"companyCoveragePercent":80,"creditLimit":1000,"active":true}}'
          curl -fsS -b developer-main.txt -X PUT -H 'Content-Type: application/json' -d "$contract" http://127.0.0.1:3127/api/branch-pilot/stores/corporateContracts/ct_ci_1 | grep '"ok":true'
          curl -fsS -b developer-main.txt http://127.0.0.1:3127/api/branch-pilot/stores/corporateContracts | grep "CI-INS"
          count=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT COUNT(*) FROM corporate_contracts WHERE id='ct_ci_1'")
          test "$count" = 1
          curl -fsS -b developer-main.txt -X DELETE http://127.0.0.1:3127/api/branch-pilot/stores/corporateContracts/ct_ci_1 | grep '"ok":true'
          hidden=$(curl -fsS -b developer-main.txt http://127.0.0.1:3127/api/branch-pilot/stores/corporateContracts)
          ! echo "$hidden" | grep -q "CI-INS"
          audit=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT COUNT(*) FROM tlab_mutation_audit_v10 WHERE record_id='ct_ci_1'")
          test "$audit" = 2

          # Atomic multi-store transaction: supplier, inventory item, purchase and journal.
          cat > unified-commit.json <<'JSON'
          {"commands":[{"store":"suppliers","operation":"add","id":"supplier_ci_1","record":{"id":"supplier_ci_1","code":"SUPCI","nameAr":"Supplier Integration","nameEn":"Supplier","active":true}},{"store":"inventoryItems","operation":"add","id":"item_ci_1","record":{"id":"item_ci_1","code":"ITEMCI","nameAr":"Reagent Integration","nameEn":"Reagent","active":true,"currentStock":0,"averageCost":10}},{"store":"purchaseInvoices","operation":"add","id":"pi_ci_1","record":{"id":"pi_ci_1","invoiceNumber":"PIN-1","supplierId":"supplier_ci_1","status":"draft","netTotal":100,"paidAmount":0,"remainingAmount":100}},{"store":"journalEntries","operation":"add","id":"je_ci_1","record":{"id":"je_ci_1","entryNumber":"JE-CI1","date":"2026-11-21","referenceType":"purchase_invoice","referenceId":"pi_ci_1","lines":[{"accountCode":"1206","debit":100,"credit":0},{"accountCode":"2101","debit":0,"credit":100}],"totalDebit":100,"totalCredit":100}}]}
          JSON
          curl -fsS -b developer-main.txt -X POST -H 'Content-Type: application/json' --data-binary @unified-commit.json http://127.0.0.1:3127/api/branch-pilot/unified/transaction | grep '"count":4'
          curl -fsS -b developer-main.txt http://127.0.0.1:3127/api/branch-pilot/unified/suppliers | grep "SUPCI"
          curl -fsS -b developer-main.txt http://127.0.0.1:3127/api/branch-pilot/unified/journalEntries | grep "JE-CI1"
          count=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT COUNT(*) FROM purchase_invoices WHERE id='pi_ci_1'")
          test "$count" = 1
          # Optimistic versioning: a stale request cannot overwrite a newer edit.
          revision=$(curl -fsS -b developer-main.txt http://127.0.0.1:3127/api/branch-pilot/unified/suppliers | node -e "let s='';process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).revisions.supplier_ci_1))")
          update="{\"commands\":[{\"store\":\"suppliers\",\"operation\":\"edit\",\"id\":\"supplier_ci_1\",\"expectedRevision\":\"$revision\",\"record\":{\"id\":\"supplier_ci_1\",\"code\":\"SUPCI\",\"nameAr\":\"Supplier Updated\",\"active\":true}}]}"
          curl -fsS -b developer-main.txt -X POST -H 'Content-Type: application/json' -d "$update" http://127.0.0.1:3127/api/branch-pilot/unified/transaction | grep '"count":1'
          code=$(curl -s -b developer-main.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$update" http://127.0.0.1:3127/api/branch-pilot/unified/transaction)
          test "$code" = 409
          cat > unified-rollback.json <<'JSON'
          {"commands":[{"store":"suppliers","operation":"add","id":"supplier_rollback_1","record":{"id":"supplier_rollback_1","code":"SUP-NOT-COMMITTED","nameAr":"DO_NOT_SAVE","active":true}},{"store":"journalEntries","operation":"add","id":"je_ci_bad","record":{"id":"je_ci_bad","entryNumber":"JE-BAD","lines":[{"accountCode":"1201","debit":100,"credit":0},{"accountCode":"2101","debit":0,"credit":20}],"totalDebit":100,"totalCredit":20}}]}
          JSON
          code=$(curl -s -b developer-main.txt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @unified-rollback.json http://127.0.0.1:3127/api/branch-pilot/unified/transaction)
          test "$code" = 409
          test "$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT COUNT(*) FROM suppliers WHERE id='supplier_rollback_1'")" = '0'
          test "$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT name_ar FROM suppliers WHERE id='supplier_ci_1'")" = 'Supplier Updated'
          count=$(mysql -N -B -h 127.0.0.1 -uroot -pintegration-only-password tlab_db -e "SELECT COUNT(*) FROM journal_entries WHERE id='je_ci_bad'")
          test "$count" = 0

          TLAB_TEST_PASSWORD=dev-test-password node scripts/ui-screens-smoke.mjs
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:3127/api/branch-pilot/logout
          code=$(curl -s -b cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:3127/api/branch-pilot/branches)
          test "$code" = 401
          echo 'BRANCH PILOT MYSQL INTEGRATION: PASS'
