name: Multi-branch MySQL data preservation test
on:
  push:
    paths:
      - 'sql/tlab_multibranch_additive_v1.sql'
      - 'sql/tlab_multibranch_pilot_safe_upgrade.sql'
      - 'sql/tlab_mysql_only_missing_tables_v4.sql'
      - 'sql/tlab_mysql_only_all_49_tables_create_safe.sql'
      - '.github/workflows/multibranch-mysql-test.yml'
  workflow_dispatch:
jobs:
  verify-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: tlab_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Create representative original records
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-only-password tlab_db <<'SQL'
          CREATE TABLE patients (id VARCHAR(64) PRIMARY KEY, name VARCHAR(191));
          INSERT INTO patients VALUES ('pat_keep', 'Original Patient');
          CREATE TABLE lab_tests (id VARCHAR(64) PRIMARY KEY, name_ar VARCHAR(191));
          INSERT INTO lab_tests VALUES ('test_keep', 'CBC');
          CREATE TABLE test_parameters (id VARCHAR(64) PRIMARY KEY, test_id VARCHAR(64));
          INSERT INTO test_parameters VALUES ('param_keep', 'test_keep');
          CREATE TABLE lab_requests (id VARCHAR(64) PRIMARY KEY, patient_id VARCHAR(64));
          INSERT INTO lab_requests VALUES ('request_keep', 'pat_keep');
          CREATE TABLE invoices (id VARCHAR(64) PRIMARY KEY, patient_id VARCHAR(64));
          INSERT INTO invoices VALUES ('invoice_keep', 'pat_keep');
          CREATE TABLE users (id VARCHAR(64) PRIMARY KEY, role VARCHAR(64));
          INSERT INTO users VALUES ('owner_keep', 'Owner'), ('staff_keep', 'Receptionist');
          SQL
      - name: Apply original migration twice
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_multibranch_additive_v1.sql
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_multibranch_additive_v1.sql
      - name: Create pilot schema and apply its specific migration twice
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-only-password -e "CREATE DATABASE IF NOT EXISTS tlab_multibranch_pilot"
          mysql -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot <<'SQL'
          CREATE TABLE users (id VARCHAR(64) PRIMARY KEY, role VARCHAR(64), active TINYINT(1));
          INSERT INTO users VALUES ('owner_pilot', 'Owner', 1);
          CREATE TABLE lab_tests (id VARCHAR(64) PRIMARY KEY);
          INSERT INTO lab_tests VALUES ('original_pilot_test');
          CREATE TABLE test_parameters (id VARCHAR(64) PRIMARY KEY);
          CREATE TABLE patients (id VARCHAR(64) PRIMARY KEY);
          CREATE TABLE lab_requests (id VARCHAR(64) PRIMARY KEY);
          CREATE TABLE invoices (id VARCHAR(64) PRIMARY KEY);
          SQL
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_multibranch_pilot_safe_upgrade.sql
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_multibranch_pilot_safe_upgrade.sql
      - name: Verify additive reference-lab schema is safe and repeatable
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_mysql_only_missing_tables_v4.sql
          mysql -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "INSERT INTO reference_lab_partners (id, code, name_ar, active, raw_json) VALUES ('ref_lab_keep', 'REF-01', 'Original partner', 1, '{\"id\":\"ref_lab_keep\"}')"
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_mysql_only_missing_tables_v4.sql
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "SELECT COUNT(*) FROM reference_lab_partners WHERE id='ref_lab_keep'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "SELECT COUNT(*) FROM lab_to_lab_dispatches")" = "0"
          echo 'PASS: two missing mapped tables created and existing partner data preserved'

      - name: Verify all 49 additive MySQL table definitions are safe and repeatable
        run: |
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_mysql_only_all_49_tables_create_safe.sql
          mysql -h 127.0.0.1 -uroot -ptest-only-password < sql/tlab_mysql_only_all_49_tables_create_safe.sql
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='tlab_multibranch_pilot'")" -ge 49
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "SELECT COUNT(*) FROM reference_lab_partners WHERE id='ref_lab_keep'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "SELECT COUNT(*) FROM lab_tests WHERE id='original_pilot_test'")" = "1"
          echo 'PASS: all 49 schema definitions applied without destroying existing data'

      - name: Verify original records and schema separation
        run: |
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "SELECT COUNT(*) FROM branches WHERE id='branch_main'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_multibranch_pilot -e "SELECT COUNT(*) FROM lab_tests WHERE id='original_pilot_test'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM branches WHERE id='branch_main'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM patients WHERE id='pat_keep'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM lab_tests WHERE id='test_keep'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM test_parameters WHERE id='param_keep'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM lab_requests WHERE id='request_keep' AND branch_id='branch_main'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM invoices WHERE id='invoice_keep' AND branch_id='branch_main'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM user_branches WHERE user_id='owner_keep'")" = "1"
          test "$(mysql -N -B -h 127.0.0.1 -uroot -ptest-only-password tlab_db -e "SELECT COUNT(*) FROM user_branches WHERE user_id='staff_keep'")" = "0"
          echo 'PASS: both migrations idempotent, original records remain intact'
