name: Build T-Lab Multi-Branch phase 4 Finance Windows EXE
on:
  push:
    paths:
      - '.github/workflows/windows-multibranch-phase1-exe.yml'
      - 'installer/multibranch-pilot.iss'
      - 'installer/launch-multibranch-pilot.cmd'
      - 'server.ts'
      - 'server/branch-access.ts'
      - 'server/branch-service.ts'
      - 'server/branch-pilot-api.ts'
      - 'src/pages/staff/branches.page.ts'
      - 'src/pages/staff/branch-permissions.panel.ts'
      - 'src/tests/services/rbac-permission.guard.test.ts'
      - 'src/tests/services/branch-user-permissions.test.ts'
      - 'src/pages/login.page.ts'
      - 'src/pages/dashboard.page.ts'
      - 'src/pages/operations/requests.page.ts'
      - 'src/pages/patients.page.ts'
      - 'src/repositories/patients.repository.ts'
      - 'src/tests/services/mysql-patients.repository.test.ts'
      - 'sql/tlab_patient_branch_access_v3.sql'
      - 'src/pages/finance/invoices.page.ts'
      - 'src/pages/finance/commissions.page.ts'
      - 'src/pages/finance/accounting.page.ts'
      - 'src/services/doctor-payout.service.ts'
      - 'src/services/manual-journal.service.ts'
      - 'src/services/manual-invoice.service.ts'
      - 'src/pages/finance/manual-journal-editor.ts'
      - 'src/tests/services/financial-reconciliation.test.ts src/tests/services/accounting-chart-mapping.test.ts src/tests/services/accounting.service.test.ts src/tests/services/contract-payment-allocation.test.ts'
      - 'src/services/invoice-adjustment.service.ts'
      - 'src/services/accounting.service.ts'
      - 'src/services/commission.service.ts'
      - 'src/pages/staff/permissions.page.ts'
      - 'server/branch-user-permissions.ts'
      - 'sql/tlab_branch_user_permissions_v2.sql'
      - 'src/app.ts'
      - 'src/pages/operations/requests.page.ts'
      - 'src/pages/finance/invoices.page.ts'
      - 'src/pages/finance/manual-journal-editor.ts'
      - 'src/services/invoice.service.ts'
      - 'src/services/invoice-adjustment.service.ts'
      - 'src/services/doctor-payout.service.ts'
      - 'src/tests/services/request-invoice-finance.test.ts'
      - 'src/tests/services/doctor-payout-ledger.test.ts'
      - 'src/tests/services/invoice-journal-reconciliation.test.ts'
      - 'src/services/mysql-sync.service.ts'
      - 'src/auth/auth.service.ts'
      - 'src/guards/permission.guard.ts'
      - 'src/router.ts'
      - 'src/types/index.ts'
      - 'src/tests/services/branch-service.test.ts src/tests/services/branch-user-permissions.test.ts'
      - 'src/tests/services/branch-access.test.ts src/tests/services/branch-service.test.ts'
      - 'sql/tlab_multibranch_additive_v1.sql'
      - 'docs/MULTIBRANCH_MIGRATION_PHASE1.md'
      - 'installer/tlab-new-icon.png'
      - 'installer/build-icon.ps1'
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: RBAC regression tests
        run: npx vitest run src/tests/services/financial-reconciliation.test.ts src/tests/services/rbac-permission.guard.test.ts src/tests/services/branch-access.test.ts src/tests/services/branch-service.test.ts src/tests/services/request-invoice-finance.test.ts src/tests/services/doctor-payout-ledger.test.ts src/tests/services/invoice-journal-reconciliation.test.ts src/tests/services/mysql-patients.repository.test.ts
      - name: Build frontend
        run: npm run build
      - name: Prepare offline installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/package | Out-Null
          Copy-Item dist,src,server,node_modules -Destination installer/package -Recurse -Force
          Copy-Item server.ts,package.json -Destination installer/package -Force
          Copy-Item sql,docs -Destination installer/package -Recurse -Force
          Copy-Item installer/launch-multibranch-pilot.cmd -Destination installer/package/launch-multibranch-pilot.cmd -Force
          if (!(Test-Path installer/package/launch-multibranch-pilot.cmd)) { throw 'Expected startup command missing from package' }
          Copy-Item (Get-Command node.exe).Source -Destination installer/package/node.exe
          if (Test-Path public) { Copy-Item public -Destination installer/package -Recurse -Force }
          if (Test-Path .env) { throw "Do not package local secrets" }
      - name: Smoke-test packaged server and static frontend on Windows
        shell: pwsh
        run: |
          $folder = (Resolve-Path 'installer/package').Path
          $node = Join-Path $folder 'node.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'tlab-smoke-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'tlab-smoke-err.log'
          $env:TLAB_BRANCH_PILOT_ADMIN_ENABLED = 'true'
          $p = Start-Process -FilePath $node -ArgumentList @('--import', 'tsx', 'server.ts', '--static-dist', '--port', '3127') -WorkingDirectory $folder -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3127/' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match '<html') { $ready = $true; break }
              } catch { }
            }
            if (!$ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'Packaged T-Lab did not serve built UI on Windows'
            }
            $legacy = Invoke-WebRequest -Uri 'http://127.0.0.1:3127/api/mysql/env-config' -UseBasicParsing -SkipHttpErrorCheck
            if ($legacy.StatusCode -ne 403) { throw "Legacy MySQL API unexpectedly accessible: $($legacy.StatusCode)" }
            $unauthed = Invoke-WebRequest -Uri 'http://127.0.0.1:3127/api/branch-pilot/branches' -UseBasicParsing -SkipHttpErrorCheck
            if ($unauthed.StatusCode -ne 401) { throw "Unauthenticated branch API unexpectedly accessible: $($unauthed.StatusCode)" }
            Write-Host 'BRANCH PILOT SECURITY SMOKE TEST VERIFIED'
            Write-Host 'PACKAGED WINDOWS STARTUP AND HTTP 200 VERIFIED'
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Verify additive SQL migration is bundled and non-destructive
        shell: pwsh
        run: |
          $file = 'installer/package/sql/tlab_multibranch_additive_v1.sql'
          if (!(Test-Path $file)) { throw 'Multi-branch migration missing' }
          if (!(Test-Path 'installer/package/sql/tlab_branch_user_permissions_v2.sql')) { throw 'User-specific branch permissions migration missing' }
          if (!(Test-Path 'installer/package/sql/tlab_patient_branch_access_v3.sql')) { throw 'Patient-branch mapping migration missing' }
          $sql = Get-Content $file -Raw
          foreach ($table in @('branches', 'user_branches', 'branch_settings', 'branch_test_prices', 'branch_inventory', 'branch_transfers', 'branch_transfer_items', 'branch_sequences', 'branch_migration_audit')) {
            $pattern = 'CREATE TABLE IF NOT EXISTS ' + [char]96 + $table + [char]96
            if (!$sql.Contains($pattern)) { throw "Missing $table" }
          }
          if ($sql -match '(?im)^\s*(DROP\s+TABLE|TRUNCATE\s+TABLE|DELETE\s+FROM|REPLACE\s+INTO)\b') { throw 'Destructive data statement found' }
          $secondary = Get-Content 'installer/package/sql/tlab_branch_user_permissions_v2.sql' -Raw
          if ($secondary -notmatch 'CREATE TABLE IF NOT EXISTS') { throw 'Per-user branch migration invalid' }
          if ($secondary -notmatch 'user_branch_permissions') { throw 'Per-user permissions table missing' }
          Write-Host 'SQL includes branch tables and per-user branch permissions, without destructive commands'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Generate new Windows application icon
        shell: pwsh
        run: |
          & ./installer/build-icon.ps1
          if (!(Test-Path installer/tlab-new-icon.ico)) { throw 'New icon missing' }
          if ((Get-Item installer/tlab-new-icon.ico).Length -lt 1000) { throw 'New icon is invalid' }
          Write-Host 'Custom app icon generated and ready for Inno Setup'
      - name: Compile EXE
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          & $compiler installer/multibranch-pilot.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Confirm artifact exists
        shell: pwsh
        run: |
          $exe = 'installer/Output/T-Lab_MultiBranch_Phase4_Finance_Windows.exe'
          if (!(Test-Path $exe)) { throw "Expected EXE missing" }
          Get-FileHash $exe -Algorithm SHA256
      - name: Silent-install EXE and verify actual Windows shortcut target
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'installer/Output/T-Lab_MultiBranch_Phase4_Finance_Windows.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'T-Lab-MultiBranch-install-test'
          New-Item -ItemType Directory -Force $target | Out-Null
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target")
          $proc = Start-Process -FilePath $exe -ArgumentList $installArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno installation failed: $($proc.ExitCode)" }
          foreach ($required in @('launch-multibranch-pilot.cmd', 'node.exe', 'server.ts', 'server/branch-pilot-api.ts', 'dist/index.html', 'sql/tlab_multibranch_additive_v1.sql', 'sql/tlab_branch_user_permissions_v2.sql', 'sql/tlab_patient_branch_access_v3.sql', 'tlab-new-icon.ico')) {
            if (!(Test-Path (Join-Path $target $required))) { throw "Missing installed file: $required" }
          }
          $command = Get-Content (Join-Path $target 'launch-multibranch-pilot.cmd') -Raw
          if (!$command.Contains('--static-dist')) { throw 'Installed launcher lacks static mode' }
          Write-Host 'INNO INSTALLED FILES VERIFIED: launcher, Node, server, frontend, SQL, icon.'
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: T-Lab-MultiBranch-Phase4-Finance-Windows-EXE
          path: installer/Output/T-Lab_MultiBranch_Phase4_Finance_Windows.exe
          if-no-files-found: error
          retention-days: 14
